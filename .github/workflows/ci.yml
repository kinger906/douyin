name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # PR only: smoke build (node-server). Production push builds once in deploy-admin.
      - name: Build admin (PR smoke)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @douyin/admin build

  deploy-admin:
    name: Deploy admin to Vercel
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Vercel preset → .vercel/output)
        run: pnpm --filter @douyin/admin build
        env:
          NITRO_PRESET: vercel
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_TTL: ${{ secrets.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL: ${{ secrets.JWT_REFRESH_TTL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}

      - name: Verify Vercel output
        working-directory: apps/admin
        run: test -d .vercel/output || (echo "Missing .vercel/output — check nuxt.config.ts nitro.preset=vercel" && exit 1)

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Sync env vars to Vercel Production
        working-directory: apps/admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_TTL: ${{ secrets.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL: ${{ secrets.JWT_REFRESH_TTL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "ERROR: VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are required"
            exit 1
          fi
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: GitHub Secret DATABASE_URL is empty"
            exit 1
          fi
          if [ -z "${JWT_ACCESS_SECRET:-}" ] || [ "${#JWT_ACCESS_SECRET}" -lt 32 ]; then
            echo "ERROR: GitHub Secret JWT_ACCESS_SECRET must be set and >= 32 characters"
            exit 1
          fi
          if [ -z "${JWT_REFRESH_SECRET:-}" ] || [ "${#JWT_REFRESH_SECRET}" -lt 32 ]; then
            echo "ERROR: GitHub Secret JWT_REFRESH_SECRET must be set and >= 32 characters"
            exit 1
          fi

          sync_env() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "Skip $name (empty)"
              return 0
            fi
            echo "Syncing $name → Vercel Production"
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$value" | vercel env add "$name" production --token="$VERCEL_TOKEN"
          }

          sync_env DATABASE_URL "$DATABASE_URL"
          sync_env JWT_ACCESS_SECRET "$JWT_ACCESS_SECRET"
          sync_env JWT_REFRESH_SECRET "$JWT_REFRESH_SECRET"
          sync_env JWT_ACCESS_TTL "${JWT_ACCESS_TTL:-15m}"
          sync_env JWT_REFRESH_TTL "${JWT_REFRESH_TTL:-30d}"
          sync_env BLOB_READ_WRITE_TOKEN "${BLOB_READ_WRITE_TOKEN:-}"
          # NUXT_PUBLIC_* is baked at build time; skip CLI sync (avoids CLI 59 visibility rules).

      - name: Deploy to Vercel (prebuilt)
        working-directory: apps/admin
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        run: |
          {
            echo "## Admin deployed"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Build: \`pnpm --filter @douyin/admin build\` (NITRO_PRESET=vercel) → \`vercel deploy --prebuilt\`"
          } >> "$GITHUB_STEP_SUMMARY"
